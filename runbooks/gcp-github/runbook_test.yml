version: 1

# Template-validation tier test. The auth, clone, inspect, derive, generate, provision and PR blocks
# all require live GitHub/GCP access, so they are skipped here; this test guards that the runbook
# parses, the input schemas are valid, and block IDs resolve.
settings:
  use_temp_working_dir: true
  timeout: 5m
  parallelizable: true

tests:
  - name: parse-and-inputs
    description: Validates the runbook loads and accepts the documented inputs.
    inputs:
      config.ProjectName: "dev"
      config.GCPProjectID: "acme-dev-123456"
      config.GCPRegion: "us-central1"
      config.StateBucketName: "acme-dev-state"
      config.OIDCResourcePrefix: "pipelines"
      config.IncludeDriftDetection: true
      config.OverwriteWorkflows: false
      config.IaCTool: "opentofu"
      config.TerragruntScaleCatalogRef: "latest"
    steps:
      - block: check-prerequisites
        expect: skip
      - block: github-auth
        expect: skip
      - block: gcp-auth
        expect: skip
      - block: check-gcp-auth
        expect: skip
      - block: clone
        expect: skip
      - block: resolve-versions
        expect: skip
      - block: read-details
        expect: skip
      - block: setup-repository
        expect: skip
      - block: bootstrap-plan
        expect: skip
      - block: bootstrap-apply
        expect: skip
      - block: open-pr
        expect: skip
