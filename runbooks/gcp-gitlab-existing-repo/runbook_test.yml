version: 1

# Template-validation tier test. The auth, clone, derive, generate, provision, and MR blocks all
# require live GitLab/GCP access, so they are skipped here; this test guards that the runbook parses,
# the input schema is valid, and block IDs resolve. Run a full integration pass manually with real
# credentials. See https://runbooks.gruntwork.io/authoring/testing/
settings:
  use_temp_working_dir: true
  timeout: 5m
  parallelizable: true

tests:
  - name: parse-and-inputs
    description: Validates the runbook loads and accepts the documented inputs.
    inputs:
      config.ProjectName: "dev"
      config.GCPProjectID: "acme-dev-123456"
      config.GCPRegion: "us-central1"
      config.StateBucketName: "acme-dev-tofu-state"
      config.GitLabGroupName: "acme"
      config.GitLabProjectName: "infrastructure-live"
      config.OIDCResourcePrefix: "pipelines"
      config.DeployBranch: "main"
      config.GitLabServerDomain: ""
      config.TerragruntScaleCatalogRef: "v1.13.1"
    steps:
      - block: check-prerequisites
        expect: skip
      - block: resolve-catalog-ref
        expect: skip
      - block: install-deps
        expect: skip
      - block: gitlab-auth
        expect: skip
      - block: gcp-auth
        expect: skip
      - block: gcp-auth-check
        expect: skip
      - block: clone
        expect: skip
      - block: check-root-hcl
        expect: skip
      - block: derive-gcp
        expect: skip
      - block: generate-bootstrap
        expect: skip
      - block: gitlab-ci-file
        expect: skip
      - block: bootstrap-plan
        expect: skip
      - block: bootstrap-apply
        expect: skip
      - block: mr
        expect: skip
      - block: verify-service-accounts
        expect: skip
      - block: verify-config
        expect: skip
