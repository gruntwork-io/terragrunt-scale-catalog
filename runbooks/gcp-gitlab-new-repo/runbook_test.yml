version: 1

# Template-validation tier test. The auth, repo-create, clone, derive, generate, provision, and MR
# blocks all require live GitLab/GCP access, so they are skipped here; this test guards that the runbook
# parses, the input schema is valid, and block IDs resolve. Run a full integration pass manually with
# real credentials. See https://runbooks.gruntwork.io/authoring/testing/
settings:
  use_temp_working_dir: true
  timeout: 5m
  parallelizable: true

tests:
  - name: parse-and-inputs
    description: Validates the runbook loads and accepts the documented inputs.
    inputs:
      config.ProjectName: "prod"
      config.GCPProjectID: "acme-prod-1a2b"
      config.GCPRegion: "us-central1"
      config.StateBucketName: "acme-prod-tofu-state"
      config.GitLabGroupName: "acme"
      config.GitLabProjectName: "infrastructure-live"
      config.Visibility: "private"
      config.GitLabServerDomain: ""
      config.OIDCResourcePrefix: "pipelines"
      deploy.DeployBranch: "main"
      config.IncludeDriftDetection: true
      config.TerragruntScaleCatalogRef: "v1.13.1"
    steps:
      - block: check-prerequisites
        expect: skip
      - block: resolve-catalog-ref
        expect: skip
      - block: install-deps
        expect: skip
      - block: gitlab-auth
        expect: skip
      - block: gcp-auth
        expect: skip
      - block: check-gcp-auth
        expect: skip
      - block: create-repo
        expect: skip
      - block: clone
        expect: skip
      - block: derive-gcp
        expect: skip
      - block: generate-bootstrap
        expect: skip
      - block: bootstrap-plan
        expect: skip
      - block: bootstrap-apply
        expect: skip
      - block: open-mr
        expect: skip
      - block: verify-service-accounts
        expect: skip
      - block: verify-generated-files
        expect: skip
