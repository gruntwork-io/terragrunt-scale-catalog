version: 1

# Template-validation tier test. The auth, create-repo, clone, derive, generate, provision, finalize, and
# PR blocks all require live GitHub/Azure access, so they are skipped here; this test guards that the
# runbook parses, the input schemas are valid, and block IDs resolve. Run a full integration pass manually
# with real credentials. See https://runbooks.gruntwork.io/authoring/testing/
settings:
  use_temp_working_dir: true
  timeout: 5m
  parallelizable: true

tests:
  - name: parse-and-inputs
    description: Validates the runbook loads and accepts the documented inputs.
    inputs:
      repo.GitHubOrgName: "acme"
      repo.GitHubRepoName: "infrastructure-live"
      repo.Visibility: "private"
      config.SubscriptionName: "dev"
      config.AzureLocation: "eastus"
      config.StateResourceGroupName: "acme-dev-tofu-state-rg"
      config.StateStorageAccountName: "acmedevtofustate01"
      config.StateStorageContainerName: "tfstate"
      config.OIDCResourcePrefix: "pipelines"
      config.DeployBranch: "main"
      config.Issuer: ""
      config.IncludeDriftDetection: true
      config.TerragruntScaleCatalogRef: "v1.13.1"
    steps:
      - block: check-prerequisites
        expect: skip
      - block: resolve-catalog-ref
        expect: skip
      - block: install-deps
        expect: skip
      - block: github-auth
        expect: skip
      - block: create-repo
        expect: skip
      - block: clone
        expect: skip
      - block: az-login
        expect: skip
      - block: check-azure-auth
        expect: skip
      - block: derive-github-ids
        expect: skip
      - block: derive-azure
        expect: skip
      - block: generate-scaffold
        expect: skip
      - block: bootstrap-plan
        expect: skip
      - block: bootstrap-apply
        expect: skip
      - block: capture-client-ids
        expect: skip
      - block: enable-remote-state
        expect: skip
      - block: migrate-state
        expect: skip
      - block: open-pr
        expect: skip
      - block: verify-workflow
        expect: skip
      - block: verify-oidc
        expect: skip
      - block: verify-config
        expect: skip
