version: 1

# Template-validation tier test. The auth, create-project, clone, derive, generate, provision, and MR
# blocks all require live GitLab/AWS access, so they are skipped here; this test guards that the runbook
# parses, the input schema is valid, and block IDs resolve. Run a full integration pass manually with
# real credentials. See https://runbooks.gruntwork.io/authoring/testing/
settings:
  use_temp_working_dir: true
  timeout: 5m
  parallelizable: true

tests:
  - name: parse-and-inputs
    description: Validates the runbook loads and accepts the documented inputs.
    inputs:
      config.AccountName: "dev"
      config.AWSRegion: "us-east-1"
      config.GitLabGroupName: "acme"
      config.GitLabProjectName: "infrastructure-live"
      config.Visibility: "private"
      config.StateBucketName: "acme-dev-tofu-state"
      config.OIDCResourcePrefix: "pipelines"
      config.DeployBranch: "main"
      config.Issuer: ""
      config.TerragruntScaleCatalogRef: "v1.13.1"
    steps:
      - block: check-prerequisites
        expect: skip
      - block: resolve-catalog-ref
        expect: skip
      - block: install-deps
        expect: skip
      - block: gitlab-auth
        expect: skip
      - block: aws-auth
        expect: skip
      - block: create-project
        expect: skip
      - block: clone
        expect: skip
      - block: derive-aws
        expect: skip
      - block: generate-scaffold
        expect: skip
      - block: bootstrap-plan
        expect: skip
      - block: bootstrap-apply
        expect: skip
      - block: merge-request
        expect: skip
      - block: verify-gitlab-ci
        expect: skip
      - block: verify-oidc-roles
        expect: skip
      - block: verify-config
        expect: skip
