version: 1

# Template-validation tier test. The auth, clone, inspect, derive, generate, provision, finalize and
# PR blocks all require live GitHub/Azure access, so they are skipped here; this test guards that the
# runbook parses, the input schemas are valid, and block IDs resolve.
settings:
  use_temp_working_dir: true
  timeout: 5m
  parallelizable: true

tests:
  - name: parse-and-inputs
    description: Validates the runbook loads and accepts the documented inputs.
    inputs:
      deploy.DeployBranch: "main"
      config.SubscriptionName: "dev"
      config.AzureLocation: "eastus"
      config.StateResourceGroupName: "rg-tfstate"
      config.StateStorageAccountName: "sttfstatedev"
      config.StateStorageContainerName: "tfstate"
      config.OIDCResourcePrefix: "pipelines"
      config.IncludeDriftDetection: true
      config.OverwriteWorkflows: false
      config.Issuer: "default"
      config.IaCTool: "opentofu"
      config.TerragruntScaleCatalogRef: "latest"
    steps:
      - block: check-prerequisites
        expect: skip
      - block: github-auth
        expect: skip
      - block: azure-auth
        expect: skip
      - block: clone
        expect: skip
      - block: inspect-repository
        expect: skip
      - block: derive-azure
        expect: skip
      - block: resolve-catalog-ref
        expect: skip
      - block: generate
        expect: skip
      - block: ensure-root-hcl
        expect: skip
      - block: install-deps
        expect: skip
      - block: add-ci-workflows
        expect: skip
      - block: write-readme
        expect: skip
      - block: bootstrap-plan
        expect: skip
      - block: bootstrap-apply
        expect: skip
      - block: enable-remote-state
        expect: skip
      - block: capture-client-ids
        expect: skip
      - block: migrate-state
        expect: skip
      - block: check-setup-branch
        expect: skip
      - block: open-pr
        expect: skip
      - block: verify-client-ids
        expect: skip
      - block: verify-config
        expect: skip
