dependencies:
  - name: aws-account
    template-url: ../../../.dependencies/aws/account
    output-folder: .

skip_files:
  - path: "README.md"
    if: "true"

variables:
  - name: AccountName
    type: string
    description: The name of the first account you are bootstrapping Pipelines in.
    order: 1

  - name: AWSAccountID
    type: string
    description: The ID of the AWS account you are bootstrapping Pipelines in.
    order: 2

  - name: GitHubOrgName
    type: string
    description: The name of the GitHub organization you are bootstrapping Pipelines in.
    order: 3

  - name: GitHubRepoName
    type: string
    description: The name of the GitHub repository you are bootstrapping Pipelines in.
    order: 4

  - name: GitHubOrgID
    type: string
    description: >-
      Numeric GitHub organization/user ID. Required for all repos created on or after 2026-07-15,
      since GitHub enforces immutable subject claims for Actions OIDC tokens on new repos from that
      date forward (https://github.blog/changelog/2026-04-23-immutable-subject-claims-for-github-actions-oidc-tokens/).
      For repos created before that date, leave blank unless the repo has separately opted in. When
      both GitHubOrgID and GitHubRepoID are set, the trust policy's `sub` claim uses the immutable
      "org@org_id/repo@repo_id" format instead of "org/repo".
    default: ""
    order: 5

  - name: GitHubRepoID
    type: string
    description: Numeric GitHub repository ID. See GitHubOrgID.
    default: ""
    order: 6

  - name: DeployBranch
    type: string
    description: The name of the branch where Pipelines will deploy changes, this branch will be granted the Apply IAM role.
    default: "main"
    order: 7

  - name: TerragruntScaleCatalogRef
    type: string
    description: The Git reference of the Terragrunt catalog to use.
    default: "v1.13.2"
    order: 8

  - name: OIDCResourcePrefix
    type: string
    description: The prefix for the OIDC resources you using to bootstrap Pipelines.
    default: "pipelines"
    order: 9

  - name: Issuer
    type: string
    description: The issuer URL for the OIDC provider (is computed dynamically from the SCM provider if not specified).
    default: ""
    order: 10

  - name: AdditionalAudiences
    type: list
    description: Additional audiences to append to the default audience (sts.amazonaws.com).
    default: []
    order: 11

  - name: ExcludeOIDCProvider
    type: bool
    description: Whether to exclude the OIDC provider from the bootstrap stack.
    default: false
    order: 12

  - name: OIDCProviderImportExisting
    type: bool
    description: Whether to import an existing OIDC provider.
    default: false
    order: 13

  - name: OIDCProviderTags
    type: map
    description: Tags to apply to the OIDC provider (useful when importing an existing provider with tags).
    default: {}
    order: 14

  - name: PlanIAMRoleImportExisting
    type: bool
    description: Whether to import an existing plan IAM role.
    default: false
    order: 15

  - name: PlanIamPolicyImportExisting
    type: bool
    description: Whether to import an existing plan IAM policy.
    default: false
    order: 16

  - name: PlanIAMRolePolicyAttachmentImportExisting
    type: bool
    description: Whether to import an existing plan IAM role policy attachment.
    default: false
    order: 17

  - name: ApplyIAMRoleImportExisting
    type: bool
    description: Whether to import an existing apply IAM role.
    default: false
    order: 18

  - name: ApplyIamPolicyImportExisting
    type: bool
    description: Whether to import an existing apply IAM policy.
    default: false
    order: 19

  - name: ApplyIAMRolePolicyAttachmentImportExisting
    type: bool
    description: Whether to import an existing apply IAM role policy attachment.
    default: false
    order: 20

  - name: PlanIAMRoleName
    description: |
      Optional. The name of the IAM role Pipelines assumes for plan. Defaults to
      "<OIDCResourcePrefix>-plan". Set it to adopt a role that already exists under a different
      name; it is then used for the role this stack manages, for the import target, and for the ARN
      Pipelines assumes.
    type: string
    default: ""

  - name: ApplyIAMRoleName
    description: |
      Optional. The name of the IAM role Pipelines assumes for apply. Defaults to
      "<OIDCResourcePrefix>-apply". Set it to adopt a role that already exists under a different
      name; it is then used for the role this stack manages, for the import target, and for the ARN
      Pipelines assumes.
    type: string
    default: ""

  - name: ApplyConditionOperator
    type: string
    description: >-
      OIDC condition operator for the apply IAM role's trust policy. Defaults to "StringEquals"
      (exact repo+branch match). Set to "StringLike" to allow a wildcard SubApplyValue (e.g. trusting
      many repos under a prefix). Leave empty to keep the secure default.
    default: ""
    order: 21

  - name: SubApplyValue
    type: string
    description: >-
      Override the apply IAM role's OIDC `sub` claim value (e.g.
      repo:org/prefix-*:ref:refs/heads/main for multi-repo trust). Use with ApplyConditionOperator
      set to "StringLike". Leave empty to keep the default exact-repo sub.
    default: ""
    order: 22

  - name: SubPlanValue
    type: string
    description: >-
      Override the plan IAM role's OIDC `sub` claim value (e.g. repo:org/prefix-*:* for multi-repo
      trust). The plan role is already StringLike. Leave empty to keep the default exact-repo sub.
    default: ""
    order: 23
