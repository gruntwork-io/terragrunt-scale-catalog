skip_files:
  - path: "README.md"
    if: "true"

dependencies:
  - name: common
    template-url: ../../../.dependencies/common
    output-folder: .
    variables:
      # Azure only: Pipelines does not plan or apply its own identities. An administrator applies each
      # subscription's pipelines-identity stack (see its README). Planning them would need tenant-wide
      # Microsoft Graph read access for the plan identity, which runs on unmerged pull requests.
      - name: PipelinesIgnoreList
        type: list
        default: ["*/pipelines-identity/**"]
  - name: gitlab
    template-url: ../../../.dependencies/gitlab
    output-folder: .
  # The azure dependency actually overrides content from the common dependency,
  # so we need to depend on it after the common dependency.
  - name: azure-base
    template-url: ../../../.dependencies/azure/base
    output-folder: .
  - name: azure-subscription
    template-url: ../subscription
    output-folder: .

