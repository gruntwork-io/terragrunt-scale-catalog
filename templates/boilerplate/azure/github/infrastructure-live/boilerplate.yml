skip_files:
  - path: "README.md"
    if: "true"

variables:
  - name: IncludeDriftDetection
    type: bool
    description: Whether to include the drift detection workflow.
    default: true
    order: 1

dependencies:
  - name: common
    template-url: ../../../.dependencies/common
    output-folder: .
    variables:
      # Pipelines does not plan or apply its own identities for azure: an administrator applies each
      # subscription's pipelines-identity stack (see its README). Planning them would need tenant-wide
      # Microsoft Graph read access for the plan identity, which runs on unmerged pull requests.
      - name: PipelinesIgnoreList
        type: list
        default: ["*/pipelines-identity/**"]
  - name: github
    template-url: ../../../.dependencies/github
    output-folder: .
  - name: github-drift-detection
    template-url: ../../../.dependencies/github-drift-detection
    output-folder: .
    skip: "{{ not .IncludeDriftDetection }}"
  # The azure dependency actually overrides content from the common dependency,
  # so we need to depend on it after the common dependency.
  - name: azure-base
    template-url: ../../../.dependencies/azure/base
    output-folder: .
  - name: azure-subscription
    template-url: ../subscription
    output-folder: .
