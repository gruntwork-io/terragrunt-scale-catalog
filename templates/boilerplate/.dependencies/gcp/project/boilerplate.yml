variables:
  - name: ProjectName
    type: string
    description: The name of the GCP project you are bootstrapping Pipelines in. This is a human-readable name used for folder naming.
    order: 1

  - name: GCPProjectID
    type: string
    description: The GCP project ID you are bootstrapping Pipelines in.
    order: 2

  - name: GCPProjectNumber
    type: string
    description: The GCP project number (numeric ID) for the project you are bootstrapping Pipelines in.
    order: 3

  - name: GCPRegion
    type: string
    description: The GCP region to configure the Google provider for.
    order: 4

  - name: StateBucketName
    type: string
    description: The name of the GCS bucket to use for storing OpenTofu state. Make sure this value is globally unique.
    order: 5

  - name: OIDCResourcePrefix
    type: string
    description: The prefix for the OIDC resources you using to bootstrap Pipelines.
    default: "pipelines"
    order: 6

  # These mirror the variables of the same name on the parent template. They must be declared here
  # too, otherwise this template cannot see them and the derived values below silently fall back to
  # the prefix -- which is how the environment file came to point at a Workload Identity provider
  # the bootstrap stack had not created.
  - name: WorkloadIdentityPoolID
    type: string
    description: The ID of the Workload Identity Pool. Leave blank to derive it from OIDCResourcePrefix.
    default: ""
    order: 7

  - name: WorkloadIdentityPoolProviderID
    type: string
    description: The ID of the Workload Identity Pool Provider. Leave blank to derive it from OIDCResourcePrefix.
    default: ""
    order: 8

  # ---------------------------------------------------------------------------
  # Derived identity values -- do not set these directly.
  #
  # Every file in this template that needs one of these identity strings must
  # REFERENCE the variable rather than re-compose the string from its parts. The
  # composition lives here, once. Re-composing in a consuming file is how both
  # known drift bugs happened: the service-account emails were built from
  # ProjectName instead of GCPProjectID, and the provider path was built from
  # OIDCResourcePrefix while the stack honoured WorkloadIdentityPool*ID.
  #
  # The defaulting below intentionally mirrors the bootstrap stack's
  # try(values.x, "<prefix>-pool") behaviour. That is still a second copy of the
  # DEFAULT, though no longer of the COMPOSITION. Removing it entirely would
  # require this file to read the stack's outputs, which is not possible:
  # Pipelines parses .gruntwork/*.hcl before any OpenTofu runs, so no dependency
  # lookup is available here.
  # ---------------------------------------------------------------------------
  - name: EffectiveWorkloadIdentityPoolID
    type: string
    description: Derived. The Workload Identity Pool ID the bootstrap stack actually creates. Do not set directly.
    default: "{{ if .WorkloadIdentityPoolID }}{{ .WorkloadIdentityPoolID }}{{ else }}{{ .OIDCResourcePrefix }}-pool{{ end }}"
    order: 9

  - name: EffectiveWorkloadIdentityPoolProviderID
    type: string
    description: Derived. The Workload Identity Pool Provider ID the bootstrap stack actually creates. Do not set directly.
    default: "{{ if .WorkloadIdentityPoolProviderID }}{{ .WorkloadIdentityPoolProviderID }}{{ else }}{{ .OIDCResourcePrefix }}-provider{{ end }}"
    order: 10

  - name: WorkloadIdentityProviderResourceID
    type: string
    description: Derived. Full resource path of the Workload Identity Provider that Pipelines authenticates against. Do not set directly.
    default: "projects/{{ .GCPProjectNumber }}/locations/global/workloadIdentityPools/{{ .EffectiveWorkloadIdentityPoolID }}/providers/{{ .EffectiveWorkloadIdentityPoolProviderID }}"
    order: 11

  - name: PlanServiceAccountEmail
    type: string
    description: Derived. Email of the plan service account the bootstrap stack creates. Do not set directly.
    default: "{{ .OIDCResourcePrefix }}-plan@{{ .GCPProjectID }}.iam.gserviceaccount.com"
    order: 12

  - name: ApplyServiceAccountEmail
    type: string
    description: Derived. Email of the apply service account the bootstrap stack creates. Do not set directly.
    default: "{{ .OIDCResourcePrefix }}-apply@{{ .GCPProjectID }}.iam.gserviceaccount.com"
    order: 13
