# Pins tool versions for local development and CI. Install mise: https://mise.jdx.dev
# Run `mise install` in the repo root to activate these versions locally.
[tools]
terragrunt = "{{ .TerragruntVersion }}"
{{ if eq .IaCTool "terraform" -}}
terraform = "{{ .TerraformVersion }}"
{{- else -}}
opentofu = "{{ .OpenTofuVersion }}"
{{- end }}
